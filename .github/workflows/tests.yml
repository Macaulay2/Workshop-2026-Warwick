name: Project Testbot

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test-bot:
    name: Testing ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/macaulay2/testbot:latest'
      volumes:
        - '${{ github.workspace }}:/home/macaulay'

    steps:
      - name: Checkout the project repository
        uses: actions/checkout@v6

      - name: Install gfan
        run: |
	 sudo wget -O /etc/apt/sources.list.d/macaulay2.sources https://macaulay2.com/Repositories/Debian/trixie/macaulay2.sources
	 sudo apt-get update
	 sudo apt-get install -y gfan

      - name: Run testbot on project branch
        run: |
          M2 --script tests/testbot.m2
